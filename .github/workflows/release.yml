name: Build and release dev-log

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller
      - name: Build portable executable
        run: pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --name "dev-log" app.py
      - name: Create release on every main push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $releaseTag = "dev-log-{0:yyyyMMdd-HHmmss}" -f (Get-Date).ToUniversalTime()
          gh release create "$releaseTag" "dist/dev-log.exe" `
            --title "dev-log $releaseTag" `
            --notes "Automated portable Windows build from $($env:RELEASE_SHA.Substring(0,7))."
