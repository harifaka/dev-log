name: Build and release dev-log

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller
      - name: Build portable executable
        run: pyinstaller --clean --noconfirm dev-log.spec
      - name: Create release on every main push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: dev-log-${{ github.run_number }}
        run: |
          gh release create "$env:RELEASE_TAG" "dist/dev-log.exe" `
            --title "dev-log $env:RELEASE_TAG" `
            --notes "Automated portable Windows build from $env:GITHUB_SHA."
